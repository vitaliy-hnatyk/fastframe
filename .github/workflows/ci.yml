name: Java CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run tests
        run: mvn -B -ntp -pl demo-app -am clean verify
      - name: JSON UTF-8 parity JUnit regressions
        run: mvn -B -ntp -pl framework-core -am test
      - name: Install soak monitoring dependency
        run: python3 -m pip install 'psutil>=6,<8'
      - name: Benchmark Python regressions
        run: python3 -m unittest discover -s benchmarks/tests
      - name: 60-minute soak harness contract smoke (no hour-long load in CI)
        run: |
          python3 -m py_compile benchmarks/soak.py benchmarks/soak_report.py
          python3 -m unittest discover -s benchmarks/tests -p 'test_soak.py' -v
      - name: Target RPS benchmark Python and JS syntax checks
        run: |
          python3 -m py_compile benchmarks/target_rps.py benchmarks/target_rps_report.py
          node --check --input-type=module < benchmarks/target_rps.js
      - name: Target RPS report / process lifecycle regression tests
        run: python3 -m unittest discover -s benchmarks/tests -p 'test_target_rps.py' -v
      - name: JSON sizes Python unit and reporting tests
        run: |
          python3 -m py_compile benchmarks/json_sizes.py benchmarks/json_sizes_report.py
          python3 -m unittest discover -s benchmarks/tests -p 'test_json_sizes.py' -v
      - name: PostgreSQL / Redis Python contract and HTML report tests
        run: |
          python3 -m py_compile benchmarks/db_redis.py benchmarks/db_redis_report.py
          python3 -m unittest discover -s benchmarks/tests -p 'test_db_redis.py' -v
      - name: Async HTTP and HS256 JWT benchmark Python contracts
        run: |
          python3 -m py_compile benchmarks/async_jwt.py benchmarks/async_jwt_report.py benchmarks/upstream.py
          python3 -m unittest discover -s benchmarks/tests -p 'test_async_jwt.py' -v
      - name: Compile benchmark JWT verifiers (JDK 21)
        run: |
          mkdir -p /tmp/fastframe-jwt-smoke
          javac -d /tmp/fastframe-jwt-smoke \
            benchmarks/fastframe-app/src/main/java/dev/fastframe/benchmark/BenchJwt.java \
            benchmarks/micronaut-app/src/main/java/dev/fastframe/micronautbench/BenchJwt.java
      - name: HTTP security smoke (no external deps)
        run: bash scripts/security-smoke.sh
      - name: CORS and rate limiting JUnit / Netty tests
        run: mvn -B -ntp -pl framework-security,framework-netty -am test
      - name: Observability Java smoke
        run: bash scripts/observability-smoke.sh
      - name: Metrics, graceful shutdown, and Netty HTTP tests
        run: mvn -B -ntp -pl framework-observability,framework-netty -am test
      - name: Feature testing over Netty and test fixture JUnit
        run: mvn -B -ntp -pl framework-testing,demo-app -am test
      - name: Bootstrap and events smoke
        run: bash scripts/bootstrap-smoke.sh
      - name: App lifecycle and events JUnit tests
        run: mvn -B -ntp -pl framework-application,framework-events -am test
      - name: CLI generator + compile-time route manifest smoke
        run: bash scripts/cli-smoke.sh
      - name: CLI JUnit tests
        run: mvn -B -ntp -pl framework-cli -am test
      - name: Storage and HTTP client smoke (JDK local server)
        run: bash scripts/storage-smoke.sh
      - name: File storage and HTTP client Maven tests
        run: mvn -B -ntp -pl framework-storage,framework-storage-s3,framework-http-client -am test
      - name: Cache TTL/LRU and memory smoke
        run: bash scripts/cache-smoke.sh
      - name: Cache unit tests and Redis adapter compilation
        run: mvn -B -ntp -pl framework-cache,framework-cache-redis -am test
      - name: Queue core, retries and cron smoke
        run: bash scripts/queue-smoke.sh
      - name: Queue and Redis adapter Maven tests
        run: mvn -B -ntp -pl framework-queue,framework-queue-redis,queue-demo -am test
      - name: "Redis integration: atomic leases and redelivery"
        env:
          FF_TEST_REDIS_URI: redis://127.0.0.1:6379
        run: mvn -B -ntp -pl framework-queue-redis -am test
      - name: Authentication and policy tests
        run: mvn -B -ntp -pl framework-auth -am test
      - name: Compile-time ORM mapper smoke
        run: bash scripts/orm-smoke.sh
      - name: ORM repositories and migration integration tests (H2)
        run: mvn -B -ntp -pl framework-orm,framework-migrations -am test
      - name: JDBC Query Builder tests (H2)
        run: mvn -B -ntp -pl framework-database -am test
      - name: Processor smoke and negative tests
        run: bash scripts/core-smoke.sh
      - name: Dependency-free HTTP benchmark routes smoke (javac)
        run: bash scripts/benchmark-smoke.sh
      - name: Build FastFrame benchmark app
        run: mvn -B -ntp -pl benchmarks/fastframe-app -am clean package
      - name: Build Micronaut benchmark app
        run: mvn -B -ntp -f benchmarks/micronaut-app/pom.xml clean package
      - name: HTTP preflight both benchmark applications
        run: python3 benchmarks/preflight.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Concurrency runner & HTML report integration smoke (FastFrame, Micronaut)
        run: |
          go install github.com/rakyll/hey@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 benchmarks/concurrency.py --frameworks fastframe micronaut --cases plain \
            --levels 1 8 --duration 2s --warmup 1s --repeats 1

      - name: Async I/O and JWT HTTP/report smoke (FastFrame and Micronaut)
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 benchmarks/async_jwt.py --frameworks fastframe micronaut \
            --cases async_10 jwt --duration 2s --warmup 0s \
            --concurrency 8 --repeats 1
      - name: JSON sizes HTTP+report smoke (FastFrame and Micronaut)
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 benchmarks/json_sizes.py --frameworks fastframe micronaut \
            --sizes 1kb 10kb 100kb 1mb --duration 2s --warmup 0s \
            --concurrency 8 --repeats 1

  postgres-redis-benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build both Java benchmark targets
        run: |
          mvn -B -ntp -pl benchmarks/fastframe-app -am package
          mvn -B -ntp -f benchmarks/micronaut-app/pom.xml package
      - name: Install hey
        run: |
          go install github.com/rakyll/hey@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, dom, xml, curl, openssl, pdo_pgsql
      - name: Install Laravel fixture for database and Redis test
        run: python3 benchmarks/setup_laravel.py
      - name: Run real PostgreSQL and Redis smoke for Java and Laravel routes
        run: |
          python3 benchmarks/db_redis.py --frameworks fastframe micronaut laravel \
            --laravel-server artisan \
            --cases select insert update transaction cache_get cache_set \
            --duration 2s --warmup 0s --concurrency 8 --repeats 1 \
            --stop-services

      - name: Async HTTP and JWT smoke for all three frameworks (Laravel artisan)
        run: |
          python3 benchmarks/async_jwt.py --frameworks fastframe micronaut laravel \
            --laravel-server artisan --cases async_10 jwt \
            --duration 2s --warmup 0s --concurrency 8 --repeats 1

  macos-benchmark-metrics:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install psutil for soak process tree tests
        run: python3 -m pip install 'psutil>=6,<8'
      - name: Test macOS process metrics and CSV parsing
        run: python3 -m unittest discover -s benchmarks/tests -v

  windows-benchmark-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install psutil for soak process tree tests
        run: python -m pip install 'psutil>=6,<8'
      - name: Run Windows backend and CSV unit tests
        run: python -m unittest discover -s benchmarks/tests -v
      - name: Windows CLI generators and JUnit tests
        shell: pwsh
        run: ./scripts/cli-smoke.ps1
      - name: Windows security tests
        shell: pwsh
        run: ./scripts/security-smoke.ps1
      - name: Windows Netty observability integration tests
        shell: pwsh
        run: ./scripts/observability-smoke.ps1
      - name: Windows feature tests (real loopback HTTP, H2, mock HTTP)
        shell: pwsh
        run: ./scripts/testing-smoke.ps1
      - name: Windows bootstrap/events Maven tests
        shell: pwsh
        run: ./scripts/bootstrap-smoke.ps1
      - name: Windows Storage and HTTP client tests
        shell: pwsh
        run: ./scripts/storage-smoke.ps1
      - name: Windows cache and Redis adapter tests
        shell: pwsh
        run: mvn -B -ntp -pl framework-cache,framework-cache-redis -am test
      - name: Windows queue and optional Redis adapter tests
        shell: pwsh
        run: ./scripts/queue-smoke.ps1
      - name: Windows auth unit tests
        shell: pwsh
        run: mvn -B -ntp -pl framework-auth -am test
      - name: Windows ORM generation smoke
        shell: pwsh
        run: ./scripts/orm-smoke.ps1
      - name: Windows ORM and migrations tests
        shell: pwsh
        run: mvn -B -ntp -pl framework-orm,framework-migrations -am test
      - name: Windows JDBC Query Builder tests
        shell: pwsh
        run: mvn -B -ntp -pl framework-database -am test
      - name: Build both benchmark servers using PowerShell
        shell: pwsh
        run: ./benchmarks/build.ps1
      - name: HTTP preflight on Windows
        shell: pwsh
        run: ./benchmarks/preflight.ps1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: HTTP load smoke test on Windows
        shell: pwsh
        run: |
          go install github.com/rakyll/hey@latest
          $env:Path = "$(go env GOPATH)\bin;$env:Path"
          ./benchmarks/run.ps1 -SkipBuild -SkipPreflight -Duration 2s -Warmup 1s -Concurrency 8 -Repeats 1 -Cases plain
      - name: Concurrency scaling smoke on Windows
        shell: pwsh
        run: |
          $env:Path = "$(go env GOPATH)\bin;$env:Path"
          ./benchmarks/concurrency.ps1 -SkipBuild -SkipPreflight -Frameworks fastframe,micronaut `
            -Cases plain -Levels 1,8 -Duration 2s -Warmup 1s -Repeats 1

      - name: JSON sizes HTTP smoke on Windows
        shell: pwsh
        run: |
          $env:Path = "$(go env GOPATH)\bin;$env:Path"
          ./benchmarks/json-sizes.ps1 -SkipBuild -SkipPreflight -Frameworks fastframe,micronaut `
            -Sizes 1kb,10kb,100kb,1mb -Duration 2s -Warmup 0s -Concurrency 8 -Repeats 1

  laravel-benchmark-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, dom, xml, curl, openssl, pdo_sqlite
      - name: Install Laravel 13 fixture (development-server smoke only)
        run: python3 benchmarks/setup_laravel.py
      - name: PHP lint tracked routes and bootstrap
        run: |
          php -l benchmarks/laravel-app/routes/bench.php
          php -l benchmarks/laravel-app/bootstrap/app.php
      - name: Verify Laravel HTTP responses
        run: python3 benchmarks/preflight.py --frameworks laravel --laravel-server artisan
